[package]
name = "nova-flux"
version = "2.3.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Local native media converter with source-aware compression and original video dimensions"

[lib]
name = "nova_flux"
path = "src/lib.rs"

[[bin]]
name = "nova-flux"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd", "dep:image"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
rfd = { version = "0.16", optional = true }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
