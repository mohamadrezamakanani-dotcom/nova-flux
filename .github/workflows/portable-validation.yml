name: Private portable validation

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: private-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.event.repository.private == true && github.ref != 'refs/heads/codex/runtime-source-release'
    name: Private ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      # Exact release-tag commits verified through the GitHub REST API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Install Linux desktop and software-rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libgl1-mesa-dev libegl1-mesa-dev libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb xauth xdg-utils
      - name: Native Windows tests, rendering and private package
        if: runner.os == 'Windows'
        env:
          WGPU_BACKEND: dx12
          NOVA_WGPU_FORCE_FALLBACK: '1'
        run: python -u scripts/run_validation.py --platform windows-x86_64 --runtime runtime --report-dir validation/windows-x86_64 --toolchain 1.99.0 --private-ci
      - name: Native Linux tests, rendering and private package
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: '1'
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python3 -u scripts/run_validation.py --platform linux-x86_64 --runtime runtime --report-dir validation/linux-x86_64 --toolchain 1.99.0 --private-ci
      - name: Retain private evidence and test packages for one day
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PRIVATE-CI-${{ matrix.platform }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            validation/${{ matrix.platform }}/*.json
            validation/${{ matrix.platform }}/*.log
            validation/${{ matrix.platform }}/*.png
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/*/package-manifest.json
            runtime/manifest.json
